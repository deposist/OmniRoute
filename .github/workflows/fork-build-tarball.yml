name: Build Fork Tarball

# Builds an installable npm tarball of THIS fork on a CI runner and attaches it as
# a workflow artifact.
#
# Why this exists: the target server has 960 MB of RAM, and `npm run build:release`
# needs ~2.5 GB of heap for the Next build (below that it is OOM-killed silently,
# right after "Creating an optimized production build"). Building here on
# ubuntu-latest and shipping the resulting tarball keeps the server out of the
# build path entirely: package.json#files already ships dist/, and the only install
# hook is postinstall (native binary fixups), which does not rebuild Next.
#
# Triggers are push (on the fork's release branch) and workflow_dispatch. What this
# deliberately does NOT do is create a tag or a GitHub Release:
#   * A v* tag would make lock-released-branch fail every future sync push to
#     release/v3.8.49 (it fails when a tag matching the branch version exists).
#   * A v* tag would also start docker-publish.yml and electron-release.yml, which
#     have no repository guard and would fail on secrets this fork lacks
#     (DOCKERHUB_USERNAME / DOCKERHUB_TOKEN / NPM_TOKEN).
# Nothing here publishes to a registry; npm publish is impossible anyway because
# the `omniroute` package name belongs to upstream.

on:
  # Auto-build on every push to the fork's release branch so a fresh tarball exists
  # without anyone remembering to press "Run workflow". Still no tag and no release is
  # created, so the upstream release plumbing stays untouched (see the note above).
  push:
    branches:
      - "release/v3.8.49"
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      # Excluded from package.json#files, so editing it cannot change the artifact.
      # Listed by exact path, not bin/**: the other bin/*.sh DO ship in the tarball.
      - "bin/update-from-fork.sh"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch, tag or SHA)"
        required: false
        default: "release/v3.8.49"
        type: string
      retention_days:
        description: "How long to keep the artifact (days)"
        required: false
        default: "30"
        type: string

permissions:
  contents: read

env:
  FORK_BUILD_NODE_VERSION: "24"

jobs:
  build-tarball:
    name: Build installable tarball
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
          # build:release embeds `git rev-parse --short HEAD`, so it needs real history.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.FORK_BUILD_NODE_VERSION }}
          # No `cache: npm` on purpose. This job now runs on push and its output is
          # installed straight onto a production host, which is exactly the shape
          # zizmor's cache-poisoning audit warns about: a poisoned npm cache entry
          # would land inside the tarball. `npm ci` from the registry costs ~1 min
          # more and keeps the artifact trustworthy.

      - name: Install dependencies
        run: npm ci

      # Build with webpack rather than the default Turbopack. The first run here died
      # at "Creating an optimized production build" with "The operation was canceled"
      # and no exit code (the runner-reclaimed signature); webpack then completed the
      # same build in ~9 min. Turbopack's native Rust allocation is not bounded by
      # --max-old-space-size (#6409), and nightly-compat.yml documents the same
      # fallback for #8090.
      #
      # Not a blanket claim that Turbopack cannot work on a hosted runner: this fork's
      # own image-plugin-artifact.yml builds 3.8.48 with OMNIROUTE_USE_TURBOPACK=1 on
      # ubuntu-latest. It runs plain `npm run build` though, while this job runs
      # `build:release` on the larger 3.8.49 graph. Webpack is the conservative choice
      # for an unattended job; flip this to "1" if you want to retest Turbopack.
      # See docs/reference/ENVIRONMENT.md (OMNIROUTE_USE_TURBOPACK).
      - name: Build release artifacts
        run: npm run build:release
        env:
          OMNIROUTE_USE_TURBOPACK: "0"

      - name: Pack tarball
        id: pack
        run: |
          set -euo pipefail
          # `npm pack` runs prepack (absent here) but NOT prepublishOnly, so this packs
          # exactly the dist/ produced by the build step above.
          FILE="$(npm pack --silent | tail -1)"
          test -s "$FILE" || { echo "npm pack produced no file" >&2; exit 1; }
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Validate tarball contents
        env:
          FILE: ${{ steps.pack.outputs.file }}
        run: |
          set -euo pipefail
          # The repo's own gate: catches a tarball missing dist/ or shipping files the
          # pack policy forbids.
          npm run check:pack-artifact

          # dist/ is what makes this tarball installable without a build, so fail loudly
          # rather than shipping something the server cannot use.
          #
          # List once into a file. `tar -tzf ... | grep -q` makes grep exit on its first
          # match, tar then dies of SIGPIPE (exit 141), and `set -o pipefail` promotes
          # that to a pipeline failure -- a false "no dist/" verdict on every tarball big
          # enough that tar is still writing when grep leaves. That is exactly how this
          # step failed run 30517881188 while dist/ was present.
          tar -tzf "$FILE" > entries.txt
          if ! grep -q '^package/dist/' entries.txt; then
            echo "::error::$FILE contains no dist/ - the server would have to build it itself."
            exit 1
          fi
          echo "Entries: $(wc -l < entries.txt), of them dist/: $(grep -c '^package/dist/' entries.txt), size: $(du -h "$FILE" | cut -f1)"

      - name: Upload tarball
        uses: actions/upload-artifact@v7
        with:
          name: omniroute-fork-tarball-${{ steps.pack.outputs.version }}
          path: ${{ steps.pack.outputs.file }}
          retention-days: ${{ inputs.retention_days || '30' }}
          if-no-files-found: error

      - name: Summary
        env:
          FILE: ${{ steps.pack.outputs.file }}
          VERSION: ${{ steps.pack.outputs.version }}
          BUILT_REF: ${{ inputs.ref || github.ref }}
        run: |
          {
            echo "## Fork tarball ready"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`$VERSION\` |"
            echo "| Ref | \`$BUILT_REF\` |"
            echo "| Commit | \`$(git rev-parse --short HEAD)\` |"
            echo "| File | \`$FILE\` |"
            echo
            echo "Download the artifact, copy it to the server, then run:"
            echo
            echo '```bash'
            echo "./bin/update-from-fork.sh --tarball ~/$FILE"
            echo '```'
            echo
            echo "That installs the prebuilt tarball without running the Next build, so it"
            echo "works on low-memory hosts. Roll back with \`--rollback\`."
          } >> "$GITHUB_STEP_SUMMARY"
